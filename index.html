<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1d1b">
<title>Inventario</title>
<style>
  :root {
    --fondo: #f3f1ea; --tarjeta: #ffffff; --tinta: #1d1d1b; --suave: #66645d; --linea: #dcd8cc;
    --anadir: #1c7548; --quitar: #b3261e; --alerta: #8a4b00; --alerta-fondo: #fdeccf;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--fondo); color: var(--tinta);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .barra { background: var(--tinta); color: #fff; }
  .barra-int { max-width: 520px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .barra h1 { margin: 0; font-size: 18px; letter-spacing: .01em; }
  .barra p { margin: 0; font-size: 13px; color: #bdb9ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .barra .titulos { flex: 1; min-width: 0; }
  .barra button { background: none; border: 1px solid #55534d; color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 14px; }

  main { max-width: 520px; margin: 0 auto; padding: 14px 16px 96px; display: grid; gap: 14px; }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--linea); border-radius: 14px; padding: 16px; }
  .etq { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--suave); }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* Visor de cámara */
  .visor { position: relative; background: #111; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 3; max-height: 46vh; width: 100%; }
  .visor video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .visor.pausa video { opacity: .35; }
  /* Marco de puntería: solo se lee lo que queda dentro. */
  .guia { position: absolute; left: 7%; right: 7%; top: 22%; bottom: 22%; border: 2px solid #fff; border-radius: 10px;
    box-shadow: 0 0 0 999px rgba(0,0,0,.4); }
  .visor.pausa .guia { border-color: rgba(255,255,255,.4); }
  .visor-inicio { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px;
    padding: 20px; text-align: center; color: #cfcbbf; font-size: 14px; }
  .visor-inicio button { background: #fff; color: var(--tinta); border: 0; border-radius: 10px; padding: 14px 22px; font-weight: 600; }
  .visor-estado { position: absolute; left: 10px; bottom: 10px; background: rgba(0,0,0,.65); color: #fff;
    font-size: 12px; padding: 4px 9px; border-radius: 99px; }

  .fila { display: flex; gap: 8px; }
  .campo { width: 100%; min-height: 48px; border: 1px solid var(--linea); border-radius: 10px; background: #fff; padding: 10px 12px; }
  .campo:focus-visible, button:focus-visible { outline: 3px solid #2b6fd6; outline-offset: 2px; }
  .btn { min-height: 48px; border-radius: 10px; border: 1px solid var(--tinta); background: var(--tinta); color: #fff; padding: 10px 16px; font-weight: 600; }
  .btn.sec { background: transparent; color: var(--tinta); border-color: var(--linea); }
  .btn:disabled { opacity: .5; cursor: default; }
  .enlace { background: none; border: 0; color: var(--suave); text-decoration: underline; padding: 10px; justify-self: center; }

  /* Producto */
  .producto h2 { margin: 2px 0 4px; font-size: 22px; line-height: 1.2; overflow-wrap: anywhere; }
  .meta { margin: 0; color: var(--suave); font-size: 14px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .stock { display: flex; align-items: baseline; gap: 12px; margin: 14px 0; padding: 12px 0; border-block: 1px solid var(--linea); }
  .stock strong { font-size: 40px; line-height: 1; }
  .chip { background: var(--alerta-fondo); color: var(--alerta); font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; }
  .cantidad { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; margin-bottom: 10px; }
  .cantidad button { min-height: 56px; border-radius: 10px; border: 1px solid var(--linea); background: #fff; font-size: 26px; line-height: 1; }
  .cantidad input { text-align: center; font-size: 24px; font-family: var(--mono); min-height: 56px; }
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acciones button { min-height: 64px; border: 0; border-radius: 12px; color: #fff; font-size: 18px; font-weight: 700; }
  .anadir { background: var(--anadir); } .quitar { background: var(--quitar); }
  .acciones button:disabled { opacity: .5; }
  .producto, .nuevo { display: grid; }

  .nuevo form, .ajustes form { display: grid; gap: 10px; margin-top: 10px; }
  label { display: grid; gap: 4px; font-size: 14px; color: var(--suave); }
  .dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .nota { font-size: 14px; color: var(--suave); margin: 0; }
  .error { color: var(--quitar); font-size: 14px; margin: 0; }

  .recientes h3 { margin: 0 0 6px; }
  .recientes ul { list-style: none; margin: 0; padding: 0; }
  .recientes li { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--linea); font-size: 14px; }
  .recientes li:first-child { border-top: 0; }
  .recientes .mas { color: var(--anadir); font-weight: 700; } .recientes .menos { color: var(--quitar); font-weight: 700; }
  .recientes .nom { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .recientes .res { color: var(--suave); }

  #aviso { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(480px, calc(100% - 28px));
    background: var(--tinta); color: #fff; padding: 13px 16px; border-radius: 12px; font-size: 15px;
    box-shadow: 0 6px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s; }
  #aviso.ver { opacity: 1; }
  #aviso.mal { background: var(--quitar); }
  @media (prefers-reduced-motion: reduce) { #aviso { transition: none; } }
</style>
</head>
<body>

<header class="barra">
  <div class="barra-int">
    <div class="titulos">
      <h1>Inventario</h1>
      <p id="negocio">Sin conectar</p>
    </div>
    <button type="button" id="btnAjustes">Ajustes</button>
  </div>
</header>

<main>
  <!-- Conexión con la planilla -->
  <section id="vistaAjustes" class="tarjeta ajustes" hidden>
    <p class="etq">Conexión con la planilla</p>
    <form id="formAjustes">
      <label>URL de la aplicación web (termina en /exec)
        <input id="aUrl" class="campo" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false"
               placeholder="https://script.google.com/macros/s/…/exec">
      </label>
      <label>PIN (solo si definiste uno en el script)
        <input id="aPin" class="campo" type="password" inputmode="numeric" autocomplete="off">
      </label>
      <p id="aError" class="error" hidden></p>
      <button class="btn" id="btnConectar">Conectar</button>
      <button type="button" class="btn sec" id="btnCompartir" hidden>Copiar enlace para otro dispositivo</button>
      <button type="button" class="btn sec" id="btnDemo">Probar sin conectar (demostración)</button>
      <button type="button" class="enlace" id="btnCerrarAjustes" hidden>Volver</button>
    </form>
    <p class="nota">La URL se guarda solo en este dispositivo. El enlace para compartir la lleva incluida, no el PIN.</p>
  </section>

  <div id="vistaEscaner" hidden style="display:grid;gap:14px">
    <div class="visor" id="visor">
      <video id="video" playsinline muted autoplay></video>
      <div class="guia" id="guia" hidden></div>
      <div class="visor-inicio" id="visorInicio">
        <span>Apunta la cámara al código de barras o QR</span>
        <button type="button" id="btnCamara">Activar cámara</button>
      </div>
      <span class="visor-estado" id="visorEstado" hidden></span>
    </div>

    <form id="formCodigo" class="fila">
      <input id="codigo" class="campo mono" autocomplete="off" autocapitalize="off" spellcheck="false"
             enterkeyhint="search" placeholder="o escribe el código" aria-label="Código del producto">
      <button class="btn">Buscar</button>
    </form>

    <section id="panelProducto" class="tarjeta producto" hidden>
      <p class="etq">Producto</p>
      <h2 id="pNombre"></h2>
      <p class="meta"><span id="pCodigo" class="mono"></span><span id="pCategoria"></span><span id="pPrecio"></span></p>
      <div class="stock">
        <span class="etq">Stock</span>
        <strong id="pStock" class="mono"></strong>
        <span id="pBajo" class="chip" hidden>En el mínimo o bajo él</span>
      </div>
      <div class="cantidad">
        <button type="button" id="btnMenos" aria-label="Una unidad menos">−</button>
        <input id="cantidad" class="campo" type="number" inputmode="numeric" min="1" step="1" value="1" aria-label="Cantidad">
        <button type="button" id="btnMas" aria-label="Una unidad más">+</button>
      </div>
      <div class="acciones">
        <button type="button" class="quitar" id="btnQuitar">− Quitar</button>
        <button type="button" class="anadir" id="btnAnadir">+ Añadir</button>
      </div>
      <button type="button" class="enlace" data-cancelar>Cancelar</button>
    </section>

    <section id="panelNuevo" class="tarjeta nuevo" hidden>
      <p class="etq">Código sin registrar</p>
      <p class="mono" id="nCodigo" style="margin:2px 0 0;font-size:18px;overflow-wrap:anywhere"></p>
      <form id="formNuevo">
        <label>Nombre del producto
          <input id="nNombre" class="campo" required autocomplete="off">
        </label>
        <label>Categoría
          <input id="nCategoria" class="campo" autocomplete="off">
        </label>
        <div class="dos">
          <label>Precio
            <input id="nPrecio" class="campo" type="number" inputmode="decimal" min="0" step="any">
          </label>
          <label>Stock mínimo
            <input id="nMinimo" class="campo" type="number" inputmode="numeric" min="0" step="1">
          </label>
        </div>
        <label>Cantidad inicial
          <input id="nCantidad" class="campo" type="number" inputmode="numeric" min="0" step="1" value="1">
        </label>
        <button class="btn" id="btnGuardar">Guardar producto</button>
      </form>
      <button type="button" class="enlace" data-cancelar>Cancelar</button>
    </section>

    <section class="tarjeta recientes" id="recientes" hidden>
      <h3 class="etq">Últimos movimientos en este dispositivo</h3>
      <ul id="listaRecientes"></ul>
    </section>
  </div>
</main>

<div id="aviso" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  // Opcional: si alojas tu propia copia de esta página, puedes dejar aquí fija la URL /exec
  // de tu planilla y nadie tendrá que pegarla.
  var API_FIJA = '';

  var ALMACEN = 'inventario-escaner';
  var $ = function (id) { return document.getElementById(id); };
  var nf = new Intl.NumberFormat('es-CL', { maximumFractionDigits: 2 });

  var cfg = leerCfg();
  var actual = null;          // producto que se está mostrando
  var codigoNuevo = '';       // código pendiente de alta
  var ocupado = false;
  var detector = null;
  var video = $('video');
  var camara = 'apagada';     // apagada | leyendo | pausa
  var ultimo = { codigo: '', hora: 0 };

  /* ---------- Configuración guardada ---------- */

  function leerCfg() {
    var c = {};
    try { c = JSON.parse(localStorage.getItem(ALMACEN)) || {}; } catch (e) {}
    var m = location.hash.match(/api=([^&]+)/);
    if (m) {
      try { c.api = decodeURIComponent(m[1]); } catch (e) {}
      try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    }
    if (API_FIJA) c.api = API_FIJA;
    return { api: c.api || '', pin: c.pin || '', demo: false };
  }

  function guardarCfg() {
    try { localStorage.setItem(ALMACEN, JSON.stringify({ api: cfg.api, pin: cfg.pin })); } catch (e) {}
  }

  /* ---------- Llamadas a la planilla ---------- */

  function api(accion, datos) {
    if (cfg.demo) return demo(accion, datos || {});
    var cuerpo = Object.assign({ accion: accion, pin: cfg.pin }, datos || {});
    // text/plain evita la consulta previa (preflight) de CORS, que Apps Script no responde.
    return fetch(cfg.api, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(cuerpo),
      redirect: 'follow'
    }).then(function (r) { return r.text(); }, function () {
      throw new Error('Sin conexión con la planilla. Revisa internet y la URL.');
    }).then(function (texto) {
      var j;
      try { j = JSON.parse(texto); } catch (e) {
        throw new Error('La planilla no respondió como se esperaba. Revisa que la URL termine en /exec y que el acceso sea "Cualquier usuario".');
      }
      if (!j.ok) throw new Error(j.error || 'Error desconocido');
      return j.datos;
    });
  }

  // Datos de ejemplo en memoria, para probar la página sin planilla.
  var demoDatos = {
    '7801234567894': { codigo: '7801234567894', producto: 'Bebida cola 1,5 L', categoria: 'Bebidas', stock: 12, minimo: 6, precio: 1890 },
    '7809876543214': { codigo: '7809876543214', producto: 'Arroz grado 1, 1 kg', categoria: 'Abarrotes', stock: 4, minimo: 5, precio: 1490 }
  };
  function demo(accion, d) {
    return new Promise(function (ok, mal) {
      setTimeout(function () {
        try {
          if (accion === 'estado') return ok({ negocio: 'Demostración (no guarda nada)', productos: Object.keys(demoDatos).length });
          var p = demoDatos[d.codigo];
          if (accion === 'buscar') return ok(p ? { encontrado: true, producto: Object.assign({}, p) } : { encontrado: false, codigo: d.codigo });
          if (accion === 'mover') {
            var n = p.stock + (d.tipo === 'entrada' ? d.cantidad : -d.cantidad);
            if (n < 0) throw new Error('No se puede quitar ' + d.cantidad + ': solo hay ' + p.stock + ' en stock');
            p.stock = n;
            return ok(Object.assign({}, p));
          }
          if (accion === 'crear') {
            demoDatos[d.codigo] = { codigo: d.codigo, producto: d.producto, categoria: d.categoria, stock: d.stock, minimo: d.minimo, precio: d.precio };
            return ok(Object.assign({}, demoDatos[d.codigo]));
          }
        } catch (e) { mal(e); }
      }, 200);
    });
  }

  /* ---------- Avisos ---------- */

  var relojAviso;
  function aviso(texto, esError) {
    var a = $('aviso');
    a.textContent = texto;
    a.className = 'ver' + (esError ? ' mal' : '');
    clearTimeout(relojAviso);
    relojAviso = setTimeout(function () { a.className = ''; }, esError ? 6000 : 3500);
  }

  function ocupar(si) {
    ocupado = si;
    ['btnAnadir', 'btnQuitar', 'btnGuardar', 'btnConectar'].forEach(function (id) { $(id).disabled = si; });
  }

  function fallo(e) {
    var msg = (e && e.message) || String(e);
    aviso(msg, true);
    if (/PIN/.test(msg)) abrirAjustes(msg);
  }

  /* ---------- Ajustes / conexión ---------- */

  var URL_OK = /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec(\?.*)?$/;

  function abrirAjustes(error) {
    $('aUrl').value = cfg.api;
    $('aPin').value = cfg.pin;
    $('aError').hidden = !error;
    $('aError').textContent = error || '';
    var conectado = !!cfg.api || cfg.demo;
    $('btnCompartir').hidden = !cfg.api;
    $('btnCerrarAjustes').hidden = !conectado;
    $('vistaAjustes').hidden = false;
    $('vistaEscaner').hidden = true;
  }

  function cerrarAjustes() {
    $('vistaAjustes').hidden = true;
    $('vistaEscaner').hidden = false;
    enfocarCodigo();
  }

  function conectar() {
    ocupar(true);
    $('negocio').textContent = 'Conectando…';
    return api('estado').then(function (e) {
      $('negocio').textContent = e.negocio + ' · ' + nf.format(e.productos) + ' productos';
      cerrarAjustes();
    }).catch(function (e) {
      $('negocio').textContent = 'Sin conectar';
      abrirAjustes((e && e.message) || String(e));
    }).then(function () { ocupar(false); });
  }

  $('formAjustes').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var url = $('aUrl').value.trim();
    if (!URL_OK.test(url)) {
      $('aError').hidden = false;
      $('aError').textContent = 'Esa no parece la URL de la aplicación web. Debe empezar con https://script.google.com/ y terminar en /exec.';
      return;
    }
    cfg.api = url; cfg.pin = $('aPin').value.trim(); cfg.demo = false;
    guardarCfg();
    conectar();
  });

  $('btnDemo').addEventListener('click', function () { cfg.demo = true; conectar(); });
  $('btnAjustes').addEventListener('click', function () { cerrarPaneles(); abrirAjustes(); });
  $('btnCerrarAjustes').addEventListener('click', cerrarAjustes);

  $('btnCompartir').addEventListener('click', function () {
    var enlace = location.origin + location.pathname + '#api=' + encodeURIComponent(cfg.api);
    var listo = function () { aviso('Enlace copiado. Ábrelo en el otro teléfono.'); };
    var manual = function () { $('aUrl').value = enlace; $('aUrl').select(); aviso('Copia el enlace que quedó en el campo de la URL.'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(enlace).then(listo, manual);
    else manual();
  });

  /* ---------- Cámara ---------- */

  var FORMATOS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'qr_code'];
  // Lector de respaldo (ZXing) para navegadores sin lector de códigos propio, como Safari en iPhone.
  var LECTOR_URL = 'https://cdn.jsdelivr.net/npm/barcode-detector@3.2.4/dist/iife/ponyfill.js';
  var recorte = document.createElement('canvas');

  function estadoCamara(nuevo) {
    camara = nuevo;
    $('visor').classList.toggle('pausa', nuevo === 'pausa');
    $('visorInicio').hidden = nuevo !== 'apagada';
    $('guia').hidden = nuevo === 'apagada';
    $('visorEstado').hidden = nuevo === 'apagada';
    $('visorEstado').textContent = nuevo === 'pausa' ? 'En pausa' : 'Buscando código…';
  }

  // Usa el lector del propio navegador si entiende códigos de barras (Chrome en Android); si no, carga el de respaldo.
  function crearDetector() {
    var Nativo = window.BarcodeDetector;
    var nativo = (Nativo && Nativo.getSupportedFormats)
      ? Nativo.getSupportedFormats().then(function (lista) {
          if (lista.indexOf('ean_13') < 0) throw new Error('sin ean_13');
          return new Nativo({ formats: FORMATOS.filter(function (f) { return lista.indexOf(f) >= 0; }) });
        })
      : Promise.reject(new Error('sin lector nativo'));
    return nativo.catch(function () {
      return new Promise(function (ok, mal) {
        if (window.BarcodeDetectionAPI) return ok();
        var sc = document.createElement('script');
        sc.src = LECTOR_URL; sc.onload = function () { ok(); };
        sc.onerror = function () { sc.remove(); mal(new Error('lector')); };
        document.head.appendChild(sc);
      }).then(function () { return new window.BarcodeDetectionAPI.BarcodeDetector({ formats: FORMATOS }); });
    });
  }

  $('btnCamara').addEventListener('click', function () {
    var boton = $('btnCamara');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      aviso('Este navegador no deja usar la cámara aquí. La página debe abrirse con https.', true);
      return;
    }
    boton.disabled = true; boton.textContent = 'Abriendo cámara…';
    crearDetector().then(function (d) {
      detector = d;
      return navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      });
    }).then(function (flujo) {
      video.srcObject = flujo;
      return video.play();
    }).then(function () {
      estadoCamara(actual || codigoNuevo ? 'pausa' : 'leyendo');
      leerCuadro();
    }).catch(function (e) {
      boton.disabled = false; boton.textContent = 'Activar cámara';
      var n = e && e.name;
      aviso(e && e.message === 'lector' ? 'No se pudo cargar el lector de códigos. Revisa la conexión; mientras, escribe el código.'
        : n === 'NotAllowedError' ? 'El navegador no tiene permiso para usar la cámara. Actívalo en los ajustes del sitio.'
        : n === 'NotFoundError' ? 'No se encontró ninguna cámara en este dispositivo.'
        : 'No se pudo abrir la cámara.', true);
    });
  });

  // Recorta del cuadro de video la zona que se ve dentro del marco y la entrega al lector.
  function zonaDelMarco() {
    var vw = video.videoWidth, vh = video.videoHeight;
    var caja = video.getBoundingClientRect();
    if (!vw || !vh || !caja.width) return null;
    var escala = Math.max(caja.width / vw, caja.height / vh);      // object-fit: cover
    var w = Math.round(0.86 * caja.width / escala), h = Math.round(0.56 * caja.height / escala);
    recorte.width = w; recorte.height = h;
    recorte.getContext('2d').drawImage(video, Math.round((vw - w) / 2), Math.round((vh - h) / 2), w, h, 0, 0, w, h);
    return recorte;
  }

  function leerCuadro() {
    if (camara === 'apagada') return;
    var sigue = function () { setTimeout(leerCuadro, 140); };
    var zona = (camara === 'leyendo' && !ocupado && !document.hidden && video.readyState >= 2) ? zonaDelMarco() : null;
    if (!zona) return sigue();
    detector.detect(zona).then(function (r) {
      if (r && r.length) alLeer(r[0].rawValue);
    }).catch(function () {}).then(sigue);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && camara !== 'apagada') video.play().catch(function () {});
  });

  function alLeer(texto) {
    texto = String(texto || '').trim();
    var ahora = Date.now();
    if (!texto || ocupado || camara !== 'leyendo') return;
    if (texto === ultimo.codigo && ahora - ultimo.hora < 3000) return;   // el mismo código sigue frente a la cámara
    if (navigator.vibrate) navigator.vibrate(60);
    buscar(texto);
  }

  function pausar() { if (camara === 'leyendo') estadoCamara('pausa'); }
  function reanudar() { if (camara === 'pausa') estadoCamara('leyendo'); }

  /* ---------- Buscar, mover y crear ---------- */

  function buscar(codigo) {
    codigo = String(codigo || '').trim();
    if (!codigo || ocupado) return;
    ultimo = { codigo: codigo, hora: Date.now() };
    cerrarPaneles(true);
    pausar();
    ocupar(true);
    aviso('Buscando ' + codigo + '…');
    api('buscar', { codigo: codigo }).then(function (r) {
      $('aviso').className = '';
      if (r.encontrado) mostrarProducto(r.producto); else mostrarNuevo(r.codigo);
    }).catch(function (e) {
      fallo(e); reanudar();
    }).then(function () { ocupar(false); });
  }

  function mostrarProducto(p) {
    actual = p;
    $('pNombre').textContent = p.producto || '(sin nombre)';
    $('pCodigo').textContent = p.codigo;
    $('pCategoria').textContent = p.categoria || '';
    $('pPrecio').textContent = p.precio ? '$' + nf.format(p.precio) : '';
    $('pStock').textContent = nf.format(p.stock);
    $('pBajo').hidden = !(p.stock <= p.minimo);
    $('cantidad').value = 1;
    $('panelProducto').hidden = false;
    $('panelProducto').scrollIntoView({ block: 'nearest' });
  }

  function mostrarNuevo(codigo) {
    codigoNuevo = codigo;
    $('formNuevo').reset();
    $('nCodigo').textContent = codigo;
    $('panelNuevo').hidden = false;
    $('nNombre').focus();
  }

  function cerrarPaneles(sinReanudar) {
    actual = null; codigoNuevo = '';
    $('panelProducto').hidden = true;
    $('panelNuevo').hidden = true;
    if (!sinReanudar) { reanudar(); enfocarCodigo(); }
  }

  function mover(tipo) {
    if (!actual || ocupado) return;
    var n = Math.floor(Number($('cantidad').value));
    if (!(n > 0)) { aviso('Ingresa una cantidad mayor que cero.', true); return; }
    ocupar(true);
    api('mover', { codigo: actual.codigo, cantidad: n, tipo: tipo }).then(function (p) {
      registrar(tipo === 'entrada' ? n : -n, p);
      aviso((tipo === 'entrada' ? 'Añadido ' : 'Quitado ') + nf.format(n) + ' · ' + p.producto + ' · stock ' + nf.format(p.stock));
      ultimo.hora = Date.now();
      cerrarPaneles();
    }).catch(fallo).then(function () { ocupar(false); });
  }

  $('btnAnadir').addEventListener('click', function () { mover('entrada'); });
  $('btnQuitar').addEventListener('click', function () { mover('salida'); });
  $('btnMas').addEventListener('click', function () { $('cantidad').value = Math.max(0, Math.floor(Number($('cantidad').value) || 0)) + 1; });
  $('btnMenos').addEventListener('click', function () { $('cantidad').value = Math.max(1, Math.floor(Number($('cantidad').value) || 1) - 1); });

  $('formNuevo').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!codigoNuevo || ocupado) return;
    var datos = {
      codigo: codigoNuevo,
      producto: $('nNombre').value.trim(),
      categoria: $('nCategoria').value.trim(),
      precio: Number($('nPrecio').value) || 0,
      minimo: Number($('nMinimo').value) || 0,
      stock: Number($('nCantidad').value) || 0
    };
    ocupar(true);
    api('crear', datos).then(function (p) {
      registrar(p.stock, p, true);
      aviso('Producto guardado · ' + p.producto + ' · stock ' + nf.format(p.stock));
      ultimo.hora = Date.now();
      cerrarPaneles();
    }).catch(fallo).then(function () { ocupar(false); });
  });

  $('formCodigo').addEventListener('submit', function (ev) {
    ev.preventDefault();
    var c = $('codigo').value;
    $('codigo').value = '';
    buscar(c);
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-cancelar]'), function (b) {
    b.addEventListener('click', function () { cerrarPaneles(); });
  });

  // En computador (o con lector USB, que "escribe" el código y pulsa Enter) el cursor vuelve solo al campo.
  function enfocarCodigo() {
    if (!window.matchMedia || !matchMedia('(pointer: coarse)').matches) $('codigo').focus();
  }

  /* ---------- Historial de la sesión ---------- */

  function registrar(delta, p, alta) {
    var li = document.createElement('li');
    var d = document.createElement('span');
    d.className = 'mono ' + (delta < 0 ? 'menos' : 'mas');
    d.textContent = (delta < 0 ? '−' : '+') + nf.format(Math.abs(delta));
    var n = document.createElement('span');
    n.className = 'nom';
    n.textContent = p.producto + (alta ? ' (nuevo)' : '');
    var r = document.createElement('span');
    r.className = 'res mono';
    r.textContent = 'queda ' + nf.format(p.stock);
    li.appendChild(d); li.appendChild(n); li.appendChild(r);
    var lista = $('listaRecientes');
    lista.insertBefore(li, lista.firstChild);
    while (lista.children.length > 8) lista.removeChild(lista.lastChild);
    $('recientes').hidden = false;
  }

  /* ---------- Arranque ---------- */

  if (cfg.api) { $('vistaEscaner').hidden = false; conectar(); }
  else abrirAjustes();
})();
</script>
</body>
</html>
